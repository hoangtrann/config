# Gruvbox Material Dark Hard Theme for tmux
# Inspired by rose-pine/tmux structure
# https://github.com/sainnhe/gruvbox-material

# ============================================
# Gruvbox Material Dark Hard Color Palette
# ============================================
# Dark backgrounds
gm_bg_dim="#141617"  # dimmest
gm_bg0="#1d2021"     # hard background
gm_bg1="#282828"     # dark gray
gm_bg2="#282828"     # dark gray
gm_bg3="#3c3836"     # medium gray
gm_bg4="#3c3836"     # medium gray
gm_bg5="#504945"     # medium light gray

# Light foregrounds
gm_fg0="#d4be98"     # main foreground
gm_fg1="#ddc7a1"     # light foreground

# Accent colors
gm_red="#ea6962"
gm_orange="#e78a4e"
gm_yellow="#d8a657"
gm_green="#a9b665"
gm_aqua="#89b482"
gm_blue="#7daea3"
gm_purple="#d3869b"

# Greys
gm_grey0="#7c6f64"
gm_grey1="#928374"
gm_grey2="#a89984"

# ============================================
# General Settings
# ============================================
set -g status-justify "centre"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
# set -g status-bg default
set -g status-style "none,bg=default"

# Double status line
# set -Fg 'status-format[1]' '#{status-format[0]}'
# set -g 'status-format[0]' ''
# set -g status 2

setw -g pane-border-status bottom
setw -g pane-border-format ''

# Pane borders
set -g pane-active-border-style "fg=$gm_bg4"
set -g pane-border-style "fg=$gm_bg4"
set -g pane-border-lines "single"

# Messages
set -g message-style "fg=$gm_fg0,bg=$gm_bg2"
set -g message-command-style "fg=$gm_fg0,bg=$gm_bg2"

# Status bar length
set -g status-right-length "100"
set -g status-left-length "100"

# ============================================
# Window Status Styles
# ============================================
setw -g window-status-activity-style "underscore,fg=$gm_aqua,bg=$gm_bg0"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=$gm_fg0,bg=$gm_bg2"

# Inactive window format
setw -g window-status-format "#[fg=$gm_fg0,bg=$gm_bg2,nobold,nounderscore,noitalics]#[fg=$gm_fg0] #I #W #[fg=$gm_fg0,bg=$gm_bg2,nobold,nounderscore,noitalics]"

# Active window format
setw -g window-status-current-format "#[fg=$gm_bg0,bg=$gm_blue,nobold,nounderscore,noitalics]#[fg=$gm_bg0,bg=$gm_blue] #I#F #W #[fg=$gm_bg0,bg=$gm_blue,nobold,nounderscore,noitalics]"

# ============================================
# Status Bar Components
# ============================================

# Left status: Session name + Time + Current directory
set -g status-left "#[fg=$gm_bg0,bg=$gm_blue] #S #[fg=$gm_aqua,bg=$gm_bg2,nobold,nounderscore,noitalics]#[fg=$gm_fg0,bg=$gm_bg2] [#{b:pane_current_path}]#[fg=$gm_aqua,bg=$gm_bg2,nobold,nounderscore,noitalics]#[fg=$gm_fg0,bg=$gm_bg2] %H:%M #[fg=$gm_bg0,bg=$gm_bg0,nobold,nounderscore,noitalics]"

# Right status: Day + User + Hostname
set -g status-right "#[fg=$gm_bg2,bg=$gm_bg0,nobold,nounderscore,noitalics]#[fg=$gm_fg0,bg=$gm_bg2] %a %b %d #[fg=$gm_aqua,bg=$gm_bg2,nobold,nounderscore,noitalics]#[fg=$gm_bg0,bg=$gm_blue] #(whoami) "
