# Gruvbox Dark Soft Theme for tmux
# Inspired by rose-pine/tmux structure
# https://github.com/morhetz/gruvbox

# ============================================
# Gruvbox Dark Soft Color Palette
# ============================================
# Dark backgrounds
gruvbox_bg0="#32302f"   # soft background
gruvbox_bg1="#3c3836"   # dark gray
gruvbox_bg2="#504945"   # medium gray
gruvbox_bg3="#665c54"   # medium light gray

# Light foregrounds
gruvbox_fg0="#fbf1c7"   # lightest
gruvbox_fg1="#ebdbb2"   # light
gruvbox_fg2="#d5c4a1"   # medium light
gruvbox_fg3="#a89984"   # medium

# Accent colors (bright)
gruvbox_red="#fb4934"
gruvbox_green="#b8bb26"
gruvbox_yellow="#fabd2f"
gruvbox_blue="#83a598"
gruvbox_purple="#d3869b"
gruvbox_aqua="#8ec07c"
gruvbox_orange="#fe8019"
gruvbox_gray="#928374"

# ============================================
# General Settings
# ============================================
set -g status-justify "centre"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
# set -g status-bg default
set -g status-style "none,bg=default"

# Double status line
# set -Fg 'status-format[1]' '#{status-format[0]}'
# set -g 'status-format[0]' ''
# set -g status 2

setw -g pane-border-status bottom
setw -g pane-border-format ''

# Pane borders
set -g pane-active-border-style "fg=$gruvbox_bg3"
set -g pane-border-style "fg=$gruvbox_bg3"
set -g pane-border-lines "single"

# Messages
set -g message-style "fg=$gruvbox_fg1,bg=$gruvbox_bg1"
set -g message-command-style "fg=$gruvbox_fg1,bg=$gruvbox_bg1"

# Status bar length
set -g status-right-length "100"
set -g status-left-length "100"

# ============================================
# Window Status Styles
# ============================================
setw -g window-status-activity-style "underscore,fg=$gruvbox_aqua,bg=$gruvbox_bg0"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=$gruvbox_fg1,bg=$gruvbox_bg1"

# Inactive window format
setw -g window-status-format "#[fg=$gruvbox_fg1,bg=$gruvbox_bg1,nobold,nounderscore,noitalics]#[fg=$gruvbox_fg1] #I #W #[fg=$gruvbox_fg1,bg=$gruvbox_bg1,nobold,nounderscore,noitalics]"

# Active window format
setw -g window-status-current-format "#[fg=$gruvbox_bg0,bg=$gruvbox_blue,nobold,nounderscore,noitalics]#[fg=$gruvbox_bg0,bg=$gruvbox_blue] #I#F #W #[fg=$gruvbox_bg0,bg=$gruvbox_blue,nobold,nounderscore,noitalics]"

# ============================================
# Status Bar Components
# ============================================

# Left status: Session name + Time + Current directory
set -g status-left "#[fg=$gruvbox_bg0,bg=$gruvbox_blue] #S #[fg=$gruvbox_aqua,bg=$gruvbox_bg1,nobold,nounderscore,noitalics]#[fg=$gruvbox_fg1,bg=$gruvbox_bg1] [#{b:pane_current_path}]#[fg=$gruvbox_aqua,bg=$gruvbox_bg1,nobold,nounderscore,noitalics]#[fg=$gruvbox_fg1,bg=$gruvbox_bg1] %H:%M #[fg=$gruvbox_bg0,bg=$gruvbox_bg0,nobold,nounderscore,noitalics]"

# Right status: Day + User + Hostname
set -g status-right "#[fg=$gruvbox_bg1,bg=$gruvbox_bg0,nobold,nounderscore,noitalics]#[fg=$gruvbox_fg1,bg=$gruvbox_bg1] %a %b %d #[fg=$gruvbox_aqua,bg=$gruvbox_bg1,nobold,nounderscore,noitalics]#[fg=$gruvbox_bg0,bg=$gruvbox_blue] #(whoami) "
