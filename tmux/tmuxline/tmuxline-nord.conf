# Nord Theme for tmux
# Inspired by rose-pine/tmux structure
# https://github.com/rose-pine/tmux

# ============================================
# Nord Color Palette
# ============================================
# Polar Night (dark backgrounds)
nord0="#2e3440"   # darkest
nord1="#3b4252"   # dark
nord2="#434c5e"   # medium dark
nord3="#4c566a"   # medium

# Snow Storm (light foreground)
nord4="#d8dee9"   # medium light
nord5="#e5e9f0"   # light
nord6="#eceff4"   # lightest

# Frost (cyan/blue accents)
nord7="#8fbcbb"   # teal
nord8="#88c0d0"   # cyan
nord9="#81a1c1"   # light blue
nord10="#5e81ac"  # blue

# Aurora (colored accents)
nord11="#bf616a"  # red
nord12="#d08770"  # orange
nord13="#ebcb8b"  # yellow
nord14="#a3be8c"  # green
nord15="#b48ead"  # purple

# ============================================
# General Settings
# ============================================
set -g status-justify "centre"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
# set -g status-bg default
set -g status-style "none,bg=default"

# Double status line
# set -Fg 'status-format[1]' '#{status-format[0]}'
# set -g 'status-format[0]' ''
# set -g status 2

setw -g pane-border-status bottom
setw -g pane-border-format ''

# Pane borders
set -g pane-active-border-style "fg=$nord3"
set -g pane-border-style "fg=$nord3"
set -g pane-border-lines "single"

# Messages
set -g message-style "fg=$nord4,bg=$nord1"
set -g message-command-style "fg=$nord4,bg=$nord1"

# Status bar length
set -g status-right-length "100"
set -g status-left-length "100"

# ============================================
# Window Status Styles
# ============================================
setw -g window-status-activity-style "underscore,fg=$nord8,bg=$nord0"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=$nord4,bg=$nord1"

# Inactive window format
setw -g window-status-format "#[fg=$nord4,bg=$nord1,nobold,nounderscore,noitalics]#[fg=$nord4] #I #W #[fg=$nord4,bg=$nord1,nobold,nounderscore,noitalics]"

# Active window format
setw -g window-status-current-format "#[fg=$nord0,bg=$nord8,nobold,nounderscore,noitalics]#[fg=$nord0,bg=$nord8] #I#F #W #[fg=$nord0,bg=$nord8,nobold,nounderscore,noitalics]"

# ============================================
# Status Bar Components
# ============================================

# Left status: Session name + Time + Current directory
set -g status-left "#[fg=$nord0,bg=$nord9] #S #[fg=$nord8,bg=$nord1,nobold,nounderscore,noitalics]#[fg=$nord4,bg=$nord1] [#{b:pane_current_path}]#[fg=$nord8,bg=$nord1,nobold,nounderscore,noitalics]#[fg=$nord4,bg=$nord1] %H:%M #[fg=$nord0,bg=$nord0,nobold,nounderscore,noitalics]"

# Right status: Day + User + Hostname
set -g status-right "#[fg=$nord1,bg=$nord0,nobold,nounderscore,noitalics]#[fg=$nord4,bg=$nord1] %a %b %d #[fg=$nord8,bg=$nord1,nobold,nounderscore,noitalics]#[fg=$nord0,bg=$nord9] #(whoami) "
