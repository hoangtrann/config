# Kitty Default Dark Theme for tmux
# Based on tmuxline-nord.conf structure
# Using Kitty's default dark color palette

# ============================================
# Kitty Default Dark Color Palette
# ============================================
# Background and foreground
bg="#000000"           # background
fg="#dddddd"           # foreground
bg_alt="#1a1a1a"       # slightly lighter background
fg_dim="#888888"       # dimmed foreground

# ANSI colors (Kitty defaults)
black="#000000"
red="#cc0403"
green="#19cb00"
yellow="#cecb00"
blue="#0d73cc"
magenta="#cb1ed1"
cyan="#0dcdcd"
white="#dddddd"

# Bright colors
bright_black="#767676"
bright_red="#f2201f"
bright_green="#23fd00"
bright_yellow="#fffd00"
bright_blue="#1a8fff"
bright_magenta="#fd28ff"
bright_cyan="#14ffff"
bright_white="#ffffff"

# ============================================
# General Settings
# ============================================
set -g status-justify "centre"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
set -g status-style "none,bg=default"

setw -g pane-border-status bottom
setw -g pane-border-format ''

# Pane borders
set -g pane-active-border-style "fg=$bright_black"
set -g pane-border-style "fg=$bright_black"
set -g pane-border-lines "single"

# Messages
set -g message-style "fg=$fg,bg=$bg_alt"
set -g message-command-style "fg=$fg,bg=$bg_alt"

# Status bar length
set -g status-right-length "100"
set -g status-left-length "100"

# ============================================
# Window Status Styles
# ============================================
setw -g window-status-activity-style "underscore,fg=$cyan,bg=$bg"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=$fg,bg=$bg_alt"

# Inactive window format
setw -g window-status-format "#[fg=$fg,bg=$bg_alt,nobold,nounderscore,noitalics]#[fg=$fg] #I #W #[fg=$fg,bg=$bg_alt,nobold,nounderscore,noitalics]"

# Active window format
setw -g window-status-current-format "#[fg=$bg,bg=$blue,nobold,nounderscore,noitalics]#[fg=$white,bg=$blue] #I#F #W #[fg=$bg,bg=$blue,nobold,nounderscore,noitalics]"

# ============================================
# Status Bar Components
# ============================================

# Left status: Session name + Time + Current directory
set -g status-left "#[fg=$bg,bg=$blue] #S #[fg=$cyan,bg=$bg_alt,nobold,nounderscore,noitalics]#[fg=$fg,bg=$bg_alt] [#{b:pane_current_path}]#[fg=$cyan,bg=$bg_alt,nobold,nounderscore,noitalics]#[fg=$fg,bg=$bg_alt] %H:%M #[fg=$bg,bg=$bg,nobold,nounderscore,noitalics]"

# Right status: Day + User + Hostname
set -g status-right "#[fg=$bg_alt,bg=$bg,nobold,nounderscore,noitalics]#[fg=$fg,bg=$bg_alt] %a %b %d #[fg=$cyan,bg=$bg_alt,nobold,nounderscore,noitalics]#[fg=$bg,bg=$blue] #(whoami) "
