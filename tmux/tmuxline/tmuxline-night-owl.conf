# Night Owl Theme for tmux
# Inspired by rose-pine/tmux structure
# https://github.com/rose-pine/tmux
# Color palette from night-owl.nvim
# https://github.com/oxfist/night-owl.nvim

# ============================================
# Night Owl Color Palette
# ============================================
# Dark backgrounds
owl_dark="#010d18"          # darkest
owl_dark2="#021320"         # very dark
owl_bg="#021727"            # main background
owl_folded="#092135"        # folded/secondary bg
owl_blue2="#0b253a"         # dark blue bg
owl_blue3="#122d42"         # medium dark blue
owl_tab_inactive="#01111d"  # tab inactive bg
owl_tab_active="#0b2942"    # tab active bg

# Medium tones
owl_gray="#262a39"          # gray
owl_gray3="#36414a"         # medium gray
owl_blue5="#234d70"         # medium blue
owl_blue7="#395a75"         # blue gray
owl_blue14="#273845"        # dark blue accent

# Light foreground
owl_fg="#d6deeb"            # main foreground
owl_gray2="#d2dee7"         # light gray
owl_white="#ffffff"         # white
owl_white2="#eeefff"        # off-white
owl_gray6="#7e97ac"         # muted blue-gray
owl_ui_border="#5f7e97"     # ui border color

# Bright accents
owl_blue="#82aaff"          # bright blue
owl_light_blue="#78ccf0"    # light blue
owl_blue8="#5ca7e4"         # medium bright blue
owl_blue11="#8eace3"        # soft blue
owl_cyan="#6ae9f0"          # cyan
owl_cyan2="#7fdbca"         # teal
owl_green="#c5e478"         # green
owl_yellow="#ffd602"        # yellow
owl_orange="#f78c6c"        # orange
owl_red="#ff5874"           # red
owl_magenta="#c792ea"       # magenta/purple

# ============================================
# General Settings
# ============================================
set -g status-justify "centre"
set -g status "on"
set -g status-left-style "none"
set -g status-right-style "none"
# set -g status-bg default
set -g status-style "none,bg=default"

# Double status line
# set -Fg 'status-format[1]' '#{status-format[0]}'
# set -g 'status-format[0]' ''
# set -g status 2

setw -g pane-border-status bottom
setw -g pane-border-format ''

# Pane borders
set -g pane-active-border-style "fg=$owl_blue7"
set -g pane-border-style "fg=$owl_blue7"
set -g pane-border-lines "single"

# Messages
set -g message-style "fg=$owl_fg,bg=$owl_folded"
set -g message-command-style "fg=$owl_fg,bg=$owl_folded"

# Status bar length
set -g status-right-length "100"
set -g status-left-length "100"

# ============================================
# Window Status Styles
# ============================================
setw -g window-status-activity-style "underscore,fg=$owl_cyan,bg=$owl_dark"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=$owl_fg,bg=$owl_folded"

# Inactive window format
setw -g window-status-format "#[fg=$owl_fg,bg=$owl_folded,nobold,nounderscore,noitalics]#[fg=$owl_fg] #I #W #[fg=$owl_fg,bg=$owl_folded,nobold,nounderscore,noitalics]"

# Active window format
setw -g window-status-current-format "#[fg=$owl_dark,bg=$owl_cyan,nobold,nounderscore,noitalics]#[fg=$owl_dark,bg=$owl_cyan] #I#F #W #[fg=$owl_dark,bg=$owl_cyan,nobold,nounderscore,noitalics]"

# ============================================
# Status Bar Components
# ============================================

# Left status: Session name + Time + Current directory
set -g status-left "#[fg=$owl_dark,bg=$owl_magenta] #S #[fg=$owl_cyan,bg=$owl_folded,nobold,nounderscore,noitalics]#[fg=$owl_fg,bg=$owl_folded] [#{b:pane_current_path}]#[fg=$owl_cyan,bg=$owl_folded,nobold,nounderscore,noitalics]#[fg=$owl_fg,bg=$owl_folded] %H:%M #[fg=$owl_dark,bg=$owl_dark,nobold,nounderscore,noitalics]"

# Right status: Day + User + Hostname
set -g status-right "#[fg=$owl_folded,bg=$owl_dark,nobold,nounderscore,noitalics]#[fg=$owl_fg,bg=$owl_folded] %a %b %d #[fg=$owl_cyan,bg=$owl_folded,nobold,nounderscore,noitalics]#[fg=$owl_dark,bg=$owl_magenta] #(whoami) "
